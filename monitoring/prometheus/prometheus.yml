global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'worker-1'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker-1:9100']

  - job_name: 'worker-2'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker-2:9100']
