version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: job_scheduler_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_scheduler}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: job_scheduler_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_scheduler}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-32bytes}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-secret-key}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic -c database/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: job_scheduler_worker_1
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-secret-key}
      CONCURRENCY_LIMIT: 5
      POLL_INTERVAL: 1.0
      HEARTBEAT_INTERVAL: 5.0
      LOG_LEVEL: INFO
      PROMETHEUS_METRICS_PORT: 9100
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: job_scheduler_worker_2
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-secret-key}
      CONCURRENCY_LIMIT: 5
      POLL_INTERVAL: 1.0
      HEARTBEAT_INTERVAL: 5.0
      LOG_LEVEL: INFO
      PROMETHEUS_METRICS_PORT: 9100
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: job_scheduler_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data:

